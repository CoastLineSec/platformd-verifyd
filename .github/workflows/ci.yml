# SPDX-License-Identifier: LGPL-2.1-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - systemd: current
            sanitize: none
            libdir: lib
          - systemd: current
            sanitize: address,undefined
            libdir: lib
          - systemd: '258'
            sanitize: none
            libdir: lib64
    name: build & test (systemd=${{ matrix.systemd }}, sanitize=${{ matrix.sanitize }})
    steps:
      - name: Install toolchain and dependencies
        run: |
          retry() {
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              if [ "$attempt" -eq 3 ]; then return 1; fi
              sleep "$((attempt * 5))"
            done
          }
          retry pacman -Sy --noconfirm --needed archlinux-keyring
          retry pacman -Syu --noconfirm --needed \
            git base-devel meson ninja gperf python-jinja \
            systemd pam dbus \
            libxslt libxml2 docbook-xsl groff shellcheck actionlint

      - uses: actions/checkout@v4

      - name: Build minimum libsystemd
        if: matrix.systemd != 'current'
        run: |
          git clone --depth=1 --branch=v258 https://github.com/systemd/systemd.git "$RUNNER_TEMP/systemd"
          test "$(git -C "$RUNNER_TEMP/systemd" rev-parse HEAD)" = 781d9d0789379d1ea1f2ecefb804d41e9c8b6c38
          env -i PATH=/usr/bin:/bin CC=cc meson setup "$RUNNER_TEMP/systemd-build" "$RUNNER_TEMP/systemd" \
            --prefix="$RUNNER_TEMP/systemd-install" --libdir=lib \
            -Dmode=release -Dtests=false -Dman=disabled -Dhtml=disabled \
            -Dtranslations=false -Dbootloader=disabled -Dc_std=gnu17 \
            -Dc_args='-Wno-error=override-init -Wno-error=discarded-qualifiers'
          ninja -C "$RUNNER_TEMP/systemd-build" libsystemd src/libsystemd/libsystemd.pc
          meson install -C "$RUNNER_TEMP/systemd-build" --no-rebuild --tags=libsystemd
          install -Dm644 "$RUNNER_TEMP/systemd-build/src/libsystemd/libsystemd.pc" \
            "$RUNNER_TEMP/systemd-install/lib/pkgconfig/libsystemd.pc"
          install -d "$RUNNER_TEMP/systemd-install/include/systemd"
          install -m644 "$RUNNER_TEMP/systemd"/src/systemd/sd-*.h \
            "$RUNNER_TEMP/systemd/src/systemd/_sd-common.h" "$RUNNER_TEMP/systemd-install/include/systemd/"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/systemd-install/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Check source, build, tests, and installation
        run: |
          set -- --libdir=${{ matrix.libdir }} \
            -Db_sanitize=${{ matrix.sanitize }} -Db_lundef=false
          if [ "${{ matrix.systemd }}" != current ]; then
            set -- "$@" -Dpamvendordir=/usr/lib64/pam.d
          fi
          bash .github/scripts/check.sh "$RUNNER_TEMP/check" "$@"
          if [ "${{ matrix.systemd }}" != current ]; then
            test -f "$RUNNER_TEMP/check/stage/usr/lib64/pam.d/platformd-verify"
          fi

      - name: Preserve failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-systemd-${{ matrix.systemd }}-sanitize-${{ matrix.sanitize }}
          path: ${{ runner.temp }}/check/build/meson-logs/
          if-no-files-found: ignore
          retention-days: 7
